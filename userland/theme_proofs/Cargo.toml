# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the live theme. Builds for the host so `cargo test`
# runs the real toolkit theme source (included via #[path]) and checks every
# scheme against the WCAG 2.1 contrast floors in floating point, which the
# capsule itself computes in integers.
[package]
name = "theme_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The theme name list, so the scheme table cannot be a different length.
nonos_policy_proto = { path = "../policy_proto" }
# The shared widgets, built for the host without the capsule runtime, so the
# widget proofs draw with the real source and the bundled faces.
nonos_toolkit = { path = "../toolkit", default-features = false }
# The roles cache's lock, for the theme source mounted by path.
spin = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
