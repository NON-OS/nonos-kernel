name: ci-trust-chain

# Reusable trust-chain attestation. `nonos-verify trust-chain` decodes and
# verifies every embedded capsule's cert + manifest against the baked
# trust-anchor policy through nonos_capsule_sign, the same chain the kernel runs
# at spawn, and emits trust-attestation.json + capsule measurements.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-trust-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trust-chain:
    name: trust-chain
    runs-on: ubuntu-latest
    defaults:
      run:
        # every step after the setup runs in `nix develop`, the shell a
        # developer gets, so CI and a contributor run the same tools
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: nonos-verify trust-chain
        run: cargo run --release --manifest-path nonos-verify/Cargo.toml -- trust-chain
      - name: Upload trust-chain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-reports-trust-chain
          path: ci-reports/
          retention-days: 14
          if-no-files-found: error
